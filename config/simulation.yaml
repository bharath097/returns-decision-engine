    margin_mean: 0.15
    margin_sd: 0.06
    quality_sd: 0.04
    reliability_sd: 0.05
    category_bias: {Small_appliances: 1.4, Home_decor: 1.6, Furniture: 1.8, Toys_games: 1.4, Tools: 1.2}
    active_from: start
  broker_liquidation:
    n_sources: 6
    manifest_prob: 0.15
    est_noise: 0.24
    margin_mean: 0.22
    margin_sd: 0.12
    quality_sd: 0.08
    reliability_sd: 0.13
    category_bias: {Low_value_bundles: 3.0, Laptops_older: 2.0, Toys_games: 1.5, Apparel_shoes: 1.3}
    active_from: start
  regional_marketplace:               # appears only after the national expansion
    n_sources: 6
    manifest_prob: 0.40
    est_noise: 0.20
    margin_mean: 0.17
    margin_sd: 0.09
    quality_sd: 0.07
    reliability_sd: 0.10
    category_bias: {Large_appliances: 2.8, Furniture: 2.8, TVs: 1.6, Home_decor: 1.5}
    active_from: expansion
