    n_sources: 8
    manifest_prob: 0.55
    est_noise: 0.12
    margin_mean: 0.20
    margin_sd: 0.07
    quality_sd: 0.05
    reliability_sd: 0.07
    category_bias: {Smartphones: 1.0, Laptops_current: 1.2, TVs: 1.5, Small_appliances: 1.3, Tools: 1.5, Toys_games: 1.1}
    active_from: start
