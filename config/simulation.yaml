# =====================================================================
#  SIMULATION PARAMETERS  --  ALL VALUES ARE PLACEHOLDERS (NOT BUYWANDER DATA)
#  Every number here is an adjustable assumption used only to generate
#  fictional data with KNOWN truth, so the methods can be validated.
#  Replace the whole simulated layer with real tables to run on real data.
# =====================================================================
seed: 20261122
timeline:
  start_date: "2024-11-01"
  end_date: "2026-10-31"          # data cutoff: items not finished by then are OPEN (censored)
  pilot_start: "2025-11-01"       # randomized fixed-price pilot begins
  photo_experiment_start: "2025-05-01"
  expansion_start: "2026-06-01"   # national expansion: new sources, new mix -> covariate shift
scale:
  n_lots: 800
  items_per_lot_median: 80
  items_per_lot_sigma: 0.55
  items_per_lot_min: 25
  items_per_lot_max: 400
  mc_draws_truth: 120             # Monte Carlo draws used to compute true expected auction outcomes
auction:
  sigma_valuation: 0.22           # spread of bidder valuations around market value
  reseller_discount: 0.85         # resellers bid at this multiple of market value
  max_bidders: 14
  start_bid_pct: [0.05, 0.15, 0.30]
  start_bid_probs: [0.50, 0.35, 0.15]
  start_bid_lambda_penalty: 1.3   # higher opening bid -> fewer bidders
  duration_days: [3, 5, 7]
  duration_probs: [0.60, 0.25, 0.15]
  glut_elasticity: -0.12          # many similar items listed in the same week lower demand
fixed_price:
  rollover_days: 21               # unsold fixed-price items roll into an auction after this many days
  rollover_lambda_factor: 0.90
  frailty_sigma: 0.30             # unobserved item-level visibility (heterogeneity)
  max_daily_hazard: 0.90
pilot:
  eligible_min_retail: 20.0
  p_fixed: 0.45                   # randomization probability into the fixed-price arm
  premium_grid: [0.10, 0.20, 0.30]
production_model:
  bias_log: -0.03                 # the "current" production model's systematic bias (log scale)
  noise_log: 0.08                 # small noise on a stale category x condition lookup (no item-level signal)
photos:
  baseline_base: 3
  per_value_threshold: [150, 400, 1000]
  extra_photos_in_experiment: 3
  experiment_share: 0.20
  experiment_p_treat: 0.50
  decay_rate: 0.5                 # diminishing returns: uplift = beta * (1 - exp(-rate * photos))
  refund_photo_effect: -0.12      # each photo lowers refund odds (log scale)
  minutes_per_photo: 0.6
conditions:
  names: [new_sealed, open_box, like_new, used, damaged]
  mu_mult: [1.18, 1.00, 0.92, 0.72, 0.38]
  handling_mult: [0.7, 1.0, 1.1, 1.4, 1.8]
  refund_mult: [0.5, 1.0, 1.0, 1.4, 2.2]
brand_tiers:
  names: [premium, mid, generic]
  probs: [0.18, 0.52, 0.30]
  retail_mult: [1.5, 1.0, 0.7]
  mu_adj: [0.06, 0.0, -0.05]
  match_correct_prob: [0.96, 0.93, 0.86]
season:                            # multiplier on market value and bidder arrival by calendar month
  1: 0.96
  2: 0.97
  3: 0.99
  4: 1.00
  5: 1.00
  6: 0.99
  7: 0.98
  8: 0.99
  9: 1.00
  10: 1.03
  11: 1.10
  12: 1.12
catalog:
  models_per_category: 40
  price_noise: 0.08
  wrong_match_same_category_prob: 0.70
  wrong_match_near_miss_prob: 0.55      # share of wrong matches that are a neighbouring model of the same brand
  wrong_match_price_ratio: [0.3, 3.5]   # a wrong match is a similar product: recorded/true retail bounded
  audit_share: 0.06               # share of items with a human-audited match label
listing:
  receipt_to_listing_mean_days: 5.0
  receipt_to_listing_shape: 2.0
  p_blind_lot_wrong_match_extra: 0.04
costs:
  handling_noise_sigma: 0.25
  shipping_noise_sigma: 0.15
  liquidation_cost_pct: 0.10
  inbound_freight_per_item_by_weight: [0.35, 0.60, 1.10, 2.40, 5.50]
lot_pricing:
  manifest_noise_scale: 0.6       # manifested lots are valued more accurately
  margin_sd_within_source: 0.05
  discount_to_manifest: 0.0
base_condition_probs:              # per source type
  big_box_returns:      [0.10, 0.28, 0.27, 0.25, 0.10]
  ecommerce_returns:    [0.12, 0.30, 0.28, 0.22, 0.08]
  overstock_closeout:   [0.55, 0.25, 0.10, 0.07, 0.03]
  broker_liquidation:   [0.08, 0.22, 0.22, 0.30, 0.18]
  regional_marketplace: [0.18, 0.26, 0.22, 0.24, 0.10]
source_types:
